name: test
on:
  # A push runs on main and on the spaces. A pull request runs on its own
  # event, so an `extract/` branch is tested once: a push trigger for it
  # would run the same job twice on one commit, and one of the two would
  # queue behind the other, which is what a required check must not wait on.
  push:
    branches: [main, 'space/**', 'slopheap/try/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun test in every project
        run: |
          status=0
          for project in $(find . -name package.json -not -path '*/node_modules/*'); do
            dir=$(dirname "$project")
            echo "::group::$dir"
            (cd "$dir" && bun test) || status=1
            echo "::endgroup::"
          done
          exit $status
